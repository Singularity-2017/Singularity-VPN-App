name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The product is a Windows application, and the runner is Linux. Without
      # this step a file that only compiles on Linux passes CI and breaks the
      # only build that matters.
      - name: Build for Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
      - name: Formatting
        run: |
          bad=$(gofmt -l cmd internal)
          if [ -n "$bad" ]; then
            echo "not formatted (gofmt -w):"
            echo "$bad"
            exit 1
          fi
