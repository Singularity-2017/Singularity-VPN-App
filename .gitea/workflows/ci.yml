name: CI

on:
  push:
  pull_request:
  # The runner is one machine that can be off or broken. Being able to start
  # the checks by hand is the difference between seeing that and guessing.
  workflow_dispatch:

jobs:
  check:
    # The only runner this installation has is the owner's Windows machine,
    # running act_runner in host mode under the label below. That is also the
    # one platform the product ships on, so every step here is already the
    # build that matters -- there is no cross-build step to add.
    runs-on: windows-latest
    defaults:
      run:
        # The steps are shell scripts, and the host provides bash through Git.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # The runner is the host itself, so Go's build and module caches are
          # already persistent and warm between runs. The action's cache would
          # tar them -- 4.5 GB on this machine -- into a copy on the same disk,
          # and on 2026-09-23 that tar hung the job after every check had passed.
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Formatting
        run: |
          bad=$(gofmt -l cmd internal)
          if [ -n "$bad" ]; then
            echo "not formatted (gofmt -w):"
            echo "$bad"
            exit 1
          fi
